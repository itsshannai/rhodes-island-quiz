<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1118">
<meta name="description" content="24 道日常性格题，从 20 位明日方舟干员中找出和你最接近的一位。">
<title>罗德岛入职档案 · 明日方舟同人测试</title>
<style>
@font-face{font-family:Rhodes Sans;src:url('rhodes-sans.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:Rhodes Display;src:url('rhodes-display.woff2') format('woff2');font-weight:600 700;font-display:swap}

:root{
  color-scheme:dark;
  --bg:#0b1118;--ink:#f5f7f8;--muted:#b4c2cc;
  --line:#364652;--cyan:#7ee6fc;--signal:#f5f7f8;
  --display:"Rhodes Display","Arial Narrow",sans-serif;
  font-family:"Rhodes Sans","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;isolation:isolate;background:var(--bg);color:var(--ink)}
body::before{
  content:"";position:fixed;inset:-24px;z-index:-1;pointer-events:none;
  background:linear-gradient(155deg,#0b1118b3,#0b1118f5 75%),url('intake-guard.webp') center 28%/cover;
  filter:blur(24px);
}
button,summary{font:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.44}
button:focus-visible,summary:focus-visible,a:focus-visible,.choice:focus-within{outline:2px solid var(--cyan);outline-offset:3px}
a{color:var(--cyan);text-underline-offset:3px}
h1,h2,h3,p,figure,blockquote{margin:0}
.frame{width:min(calc(100% - 64px),1200px);margin-inline:auto}
.site-head{
  min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--line);
}
.wordmark{display:flex;align-items:center;gap:11px;font-size:.94rem;font-weight:800;letter-spacing:.055em}
.emblem{
  width:21px;height:23px;flex:none;background:var(--ink);
  clip-path:polygon(50% 0,100% 92%,80% 92%,50% 36%,20% 92%,0 92%);
}
.fan,.site-foot{color:var(--muted);font-size:.77rem}
.fan{white-space:nowrap}
.site-foot{
  display:flex;gap:7px 16px;flex-wrap:wrap;justify-content:space-between;
  border-top:1px solid var(--line);padding:16px 0 max(18px,env(safe-area-inset-bottom));
}
main{min-height:calc(100svh - 115px);padding:18px 0 40px}
.action,.secondary,.art-action{
  display:inline-grid;place-items:center;min-height:49px;padding:10px 17px;
  border:1px solid var(--line);font-weight:750;
}
.action{background:var(--ink);border-color:var(--ink);color:#0c141a}
.action:hover:not(:disabled){background:var(--cyan);border-color:var(--cyan)}
.secondary,.art-action{color:var(--ink);background:#101820ea}
.secondary:hover:not(:disabled),.art-action:hover{border-color:var(--cyan)}
.kicker,.counter,.operator-code,.match strong,.rank-list strong{
  font-family:var(--display);font-weight:650;letter-spacing:.095em;
}
.kicker,.counter{color:var(--cyan);font-size:.83rem}

.intro{
  position:relative;isolation:isolate;overflow:hidden;display:grid;align-items:end;
  min-height:clamp(525px,calc(100svh - 120px),770px);border-bottom:2px solid var(--cyan);
  background:#14222d;
}
.intro-art{
  position:absolute;inset:0;z-index:-3;overflow:hidden;
  background:linear-gradient(125deg,#0b182196,#0b182143),url('intake-prism.webp') center 44%/cover;
}
.intro-art::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,#080f17db 0%,#080f17a6 28%,transparent 62%),
             linear-gradient(0deg,#080f17 0%,transparent 48%);
}
.intake-amiya{
  position:absolute;right:0;top:0;display:block;width:78%;height:100%;object-fit:contain;
  object-position:center 39%;transform:scale(1.16);transform-origin:58% 32%;
  filter:drop-shadow(0 15px 24px #050e19b5);
}
.intro-copy{width:min(100%,570px);padding:clamp(26px,5vw,68px)}
.intro h1{
  font-size:clamp(2.9rem,6.1vw,5.2rem);font-weight:900;line-height:1.05;
  letter-spacing:-.075em;margin:12px 0 18px;text-wrap:balance;
}
.intro .lead{max-width:33ch;color:#e1e8ed;font-size:1rem;line-height:1.65}
.intro .action{min-width:185px;margin-top:23px}
.intro small{display:block;color:var(--muted);margin-top:10px;font-size:.79rem}

.quiz{
  width:min(100%,690px);min-height:calc(100svh - 157px);margin:7px auto 0;
  display:flex;flex-direction:column;
}
.progress-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;font-weight:720}
.counter{font-size:1.15rem}
progress{appearance:none;width:100%;height:3px;border:0;display:block;background:var(--line)}
progress::-webkit-progress-bar{background:var(--line)}
progress::-webkit-progress-value{background:var(--cyan)}
progress::-moz-progress-bar{background:var(--cyan)}
.quiz form{display:flex;flex:1;flex-direction:column}
fieldset{padding:0;border:0;margin:30px 0 20px;min-width:0}
legend{padding:0;margin-bottom:16px;font-size:clamp(1.32rem,4.7vw,2.12rem);font-weight:800;line-height:1.37;text-wrap:pretty}
legend:focus,h1:focus{outline:none}
#choices{border-top:1px solid var(--line)}
.choice{
  display:flex;gap:13px;align-items:center;min-height:58px;padding:11px 12px;
  cursor:pointer;background:#101a23bf;border-bottom:1px solid var(--line);line-height:1.45;
}
.choice:hover{background:#1c2a35}
.choice:has(input:checked){background:#1a3340;box-shadow:inset 3px 0 var(--cyan);border-color:#63acbc}
.choice input{margin:0;accent-color:var(--cyan);width:18px;height:18px;flex:0 0 18px}
.controls{display:flex;gap:10px;align-items:center;justify-content:space-between}
.quiz .controls{margin-top:auto;padding-top:10px}
.quiz .action{min-width:min(58%,205px)}

.hero{background:#111a23}
.stage{
  position:relative;isolation:isolate;overflow:hidden;height:clamp(510px,74svh,780px);
  background:
    radial-gradient(ellipse at 60% 32%,color-mix(in srgb,var(--operator-tone) 46%,transparent),transparent 60%),
    linear-gradient(126deg,#14243861,#101924df),url('archive-background.webp') center 41%/cover,#141e29;
}
.stage::before{
  content:"";position:absolute;inset:11px;z-index:-1;pointer-events:none;
  background:linear-gradient(var(--operator-tone),var(--operator-tone)) left top/32px 1px no-repeat,
             linear-gradient(var(--operator-tone),var(--operator-tone)) left top/1px 22px no-repeat;
}
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(0deg,#0a1119 1%,#0a1119c4 13%,#0a111936 32%,transparent 53%);
}
.photo{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:contain;object-position:center 37%;transform:scale(1.11);transform-origin:center 29%;
  filter:drop-shadow(0 13px 18px #0008);
}
.art-action{position:absolute;z-index:3;top:13px;right:13px;min-height:44px;font-size:.8rem;padding:6px 11px}
.archive-plate{
  position:absolute;z-index:2;bottom:0;inset-inline:clamp(16px,4.3vw,55px);display:grid;
  grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:12px;
  padding:10px 0 14px;border-bottom:1px solid var(--operator-tone);
}
.plate-name .kicker{letter-spacing:.04em}
.archive-plate h1{
  margin:2px 0 4px;font-size:clamp(2.25rem,9vw,6.1rem);font-weight:900;
  line-height:1.06;letter-spacing:-.07em;overflow-wrap:break-word;
}
.operator-code{color:#d3e2ea;text-transform:uppercase;font-size:clamp(.9rem,3.5vw,1.2rem)}
.match{
  display:grid;gap:4px;justify-items:end;white-space:nowrap;border-left:1px solid #a7c7d35f;
  padding-left:12px;color:var(--cyan);
}
.match strong{font-size:clamp(1.65rem,5.9vw,3.25rem);line-height:1;letter-spacing:0}
.match span{font-size:.71rem;color:#dce5e9}
.hero-text{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;
  gap:clamp(16px,4vw,52px);padding:clamp(18px,3.8vw,44px);
}
.quote{font-size:1.18rem;line-height:1.45;font-weight:790}
.hero-copy{color:var(--muted);line-height:1.72;margin-top:6px}
.hero-text .profile-copy{grid-column:1;grid-row:1}
.voice{grid-column:2;grid-row:1;border-left:2px solid var(--cyan);padding:2px 0 2px 13px}
.voice p{font-size:1.08rem;font-weight:690;line-height:1.6}
.voice cite{display:block;margin-top:6px;font-size:.79rem;font-style:normal}

.data-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:34px;margin-top:19px}
.panel{min-width:0;padding:21px 0 24px;border-top:1px solid var(--line)}
.panel h2{font-size:1.19rem;margin-bottom:13px;line-height:1.4}
.radar{display:block;width:min(100%,405px);height:auto;margin:0 auto;overflow:visible}
.radar text{fill:var(--muted);font-size:12px;font-family:"Rhodes Sans",system-ui,sans-serif}
.radar .grid{fill:none;stroke:#54636e;stroke-width:1}
.radar .axis{stroke:#40515e;stroke-width:1}
.radar .you{fill:#f5f7f825;stroke:var(--signal);stroke-width:2.2;stroke-linejoin:round}
.radar .operator{fill:#7ee6fc12;stroke:var(--cyan);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round}
.key{display:flex;gap:9px 18px;flex-wrap:wrap;justify-content:center;color:var(--muted);font-size:.84rem;margin-top:6px}
.key span::before{
  content:"";display:inline-block;width:14px;border-top:2px solid var(--signal);margin-right:6px;vertical-align:middle;
}
.key span+span::before{border-top:2px dashed var(--cyan)}
.insights{display:grid;gap:0}
.insight{border-bottom:1px solid var(--line);padding:13px 0}
.insight:first-child{padding-top:0}
.insight h3{font-size:1rem;line-height:1.4}
.insight h3 span{color:var(--cyan);font-size:.81rem;margin-right:10px}
.insight p{color:#d4dce2;line-height:1.62;margin-top:4px}
.more-traits{margin-top:3px}
.more-traits summary{padding:12px 0;min-height:44px;color:var(--cyan);font-size:.9rem}
.traitlist{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.trait{font-size:.89rem;padding-bottom:8px;border-bottom:1px solid var(--line)}
.trait:last-child{border:0}
.trait p{color:var(--muted);margin-top:3px;line-height:1.55}
.rank-list{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.rank-list li{display:grid;grid-template-columns:minmax(5.2em,auto) 1fr 3.25em;align-items:center;gap:9px;font-size:.92rem}
.rank-list li strong{text-align:right;letter-spacing:.03em}
.rank-line{height:5px;background:#33424e}
.rank-line i{display:block;height:100%;background:#8195a5}
.rank-list li:first-child .rank-line i{background:var(--cyan)}
.note,.basis,.evidence li{color:var(--muted);line-height:1.67}
.note,.basis{font-size:.85rem;margin-top:11px}
.evidence ol{padding-left:1.17rem;margin:0}
.evidence li+li{margin-top:6px}
.evidence strong{color:var(--ink)}
.share-panel{
  display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:center;
  background:#e5edf1;color:#101a22;border:0;border-left:3px solid #67b8cd;padding:15px;
}
.share-panel h2{margin-bottom:4px}
.share-panel p{font-size:.87rem;color:#314653;line-height:1.53;overflow-wrap:anywhere}
.share-panel .secondary{margin-top:8px;min-height:44px;padding:7px 10px;font-size:.86rem}
.share-panel a{color:#143c50}
.qr-frame{background:#fff;border:1px solid #acbcc4;padding:3px}
.share-code{display:block;width:100%;height:auto;image-rendering:pixelated}
.result-controls{margin-top:16px;justify-content:flex-end}
.status{color:var(--muted);font-size:.85rem;margin-top:8px}
.status:empty{display:none}
dialog{
  width:min(calc(100% - 22px),980px);padding:14px;border:1px solid var(--line);
  background:#101820;color:var(--ink);overflow:auto;max-height:92svh;
}
dialog::backdrop{background:#070b0ee8}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.dialog-head h2{font-size:1rem}
.dialog-art{display:block;width:100%;height:74svh;object-fit:contain}

@media(max-width:680px){
  .frame{width:calc(100% - 36px)}
  .site-head{min-height:52px}
  main{padding:0 0 26px}
  .intro,.hero{margin-inline:-18px}
  .intro{min-height:clamp(520px,calc(100svh - 52px),760px)}
  .intro-art{background-position:center 20%}
  .intro-art::after{
    background:linear-gradient(0deg,#080f17 2%,#080f17f0 18%,#080f17bc 34%,#080f1744 49%,transparent 63%);
  }
  .intake-amiya{top:-1%;right:-23%;width:145%;height:78%;object-position:center top;transform:scale(1.02)}
  .intro-copy{padding:23px 19px 21px}
  .intro h1{font-size:clamp(2.4rem,11.5vw,4.6rem);margin:9px 0 12px}
  .intro .lead{font-size:.96rem}
  .intro .action{width:100%;margin-top:17px;min-height:51px}
  .quiz{margin-top:5px;min-height:calc(100svh - 87px)}
  fieldset{margin:21px 0 14px}
  legend{margin-bottom:14px}
  .choice{min-height:54px;padding:9px 10px}
  .quiz .controls{
    position:sticky;z-index:4;bottom:0;margin-inline:-18px;padding:8px 18px max(8px,env(safe-area-inset-bottom));
    border-top:1px solid #40505d;background:#0b1118f5;
  }
  .stage{height:clamp(405px,calc(100svh - 82px),685px)}
  .photo{left:-12%;width:124%;object-position:center 32%;transform:scale(1.08);transform-origin:center 24%}
  .art-action{top:9px;right:9px}
  .archive-plate{inset-inline:17px;padding-bottom:12px}
  .archive-plate h1{font-size:clamp(2.1rem,11vw,4.5rem)}
  .hero-text{grid-template-columns:1fr;gap:14px;padding:17px 18px 20px}
  .voice{grid-column:1}
  .hero-text .profile-copy{grid-row:2}
  .data-grid{grid-template-columns:1fr;margin-top:14px}
  .panel{padding-block:17px 20px}
  .share-panel{grid-template-columns:96px minmax(0,1fr);padding:12px}
  .result-controls .action{flex:1}
}
@media(prefers-reduced-motion:no-preference){
  .action,.secondary,.choice,.art-action{transition:background-color .18s,border-color .18s}
  .intro-art{animation:hero-arrive .55s ease-out both}
  .stage .photo{animation:hero-arrive .48s ease-out both}
  .archive-plate{animation:panel-arrive .26s .22s ease-out both}
  #form[data-transition="even"] fieldset{animation:question-even .18s ease-out both}
  #form[data-transition="odd"] fieldset{animation:question-odd .18s ease-out both}
  @keyframes hero-arrive{from{opacity:.36}to{opacity:1}}
  @keyframes panel-arrive{from{opacity:0;translate:0 8px}to{opacity:1;translate:none}}
  @keyframes question-even{from{opacity:.58}to{opacity:1}}
  @keyframes question-odd{from{opacity:.58}to{opacity:1}}
}
</style>
</head>
<body>
<header class="frame site-head"><span class="wordmark"><i class="emblem" aria-hidden="true"></i>罗德岛入职档案</span><span class="fan">非官方同人测试</span></header>
<main class="frame">
  <section class="intro" id="intro">
    <div class="intro-art"><img class="intake-amiya" src="intake-guard.webp" alt="近卫阿米娅的精二立绘，冷蓝剑光环绕人物" width="1240" height="1240" fetchpriority="high"></div>
    <div class="intro-copy">
      <p class="kicker">RHODES ISLAND / INTAKE FILE</p>
      <h1>你最像哪位<br>罗德岛干员？</h1>
      <p class="lead">你刚登上罗德岛。夜宵桌上有个空位，靠港还有半天。遇到这些小事，选你平时最可能做的那一件。</p>
      <button type="button" class="action" id="start">开始测试</button>
      <small>24 道情境题 · 约 4 分钟 · 20 位干员</small>
    </div>
  </section>
  <section class="quiz" id="quiz" hidden>
    <div class="progress-row"><span>入职问卷</span><span class="counter" id="counter"></span></div>
    <progress id="progress" max="24" value="0" aria-label="已完成的题数"></progress>
    <form id="form">
      <fieldset><legend id="question" tabindex="-1"></legend><div id="choices"></div></fieldset>
      <div class="controls"><button type="button" class="secondary" id="previous">上一题</button><button type="submit" class="action" id="next" disabled>下一题</button></div>
    </form>
  </section>
  <section class="results story-result" id="results" hidden></section>
  <noscript>请启用 JavaScript 后开始测试。</noscript>
</main>
<footer class="frame site-foot"><span>仅供娱乐 · 答题在本机处理</span><span>干员立绘 © 鹰角网络</span></footer>
<script>
const dimensions = [
  ['社交方式', '安静观察', '主动靠近'],
  ['信任节奏', '熟悉后敞开', '先给一点信任'],
  ['分歧表达', '等合适时机', '及时说开'],
  ['面对未知', '需要确定感', '享受即兴'],
  ['责任倾向', '尊重各自选择', '主动接住局面'],
  ['关心方式', '提供实际帮助', '给予情绪陪伴'],
];

// Choices run from the first pole to the second; display order is interleaved.
const bank = [
  [0, "刚登上罗德岛。门口有人在吃夜宵，里面还有一个空位。你进去之后呢？", "挑个位置坐下。先听听今晚都在聊什么。", "跟旁边的人打个招呼，有话题再慢慢聊。", "顺着桌上的话题接一句，坐进去再说。", "端着碗问一句「你们聊到哪儿了？」"],
  [3, "你常点的那家店今天休息。隔壁新开了一家，菜单全是你没吃过的。", "走两条街也行，我还有一家常吃的。", "看看店里有没有一种我熟悉的口味。", "进去点个最小份的，尝尝看。", "问老板什么最特别，今天就吃那个。"],
  [5, "朋友剪了一个月的视频，只收到十来个赞。凌晨他给你发了句「删了算了」。", "问他愿不愿意让我一起看，找找有没有能改的地方。", "陪他把想留的素材先备份，明天再看删不删。", "说我看得出他花了很久，问他最舍不得删哪一段。", "回一句「我在」，陪他把这一个月的心情说完。"],
  [2, "朋友每次都替你点同一杯饮料。今天杯子又推到你面前，可你早就想换了。", "今天先喝，下次出门前和他说我想换一杯。", "等喝完我们单独走的时候，顺口提一下。", "接杯子时就说「下次我想自己点」。", "趁现在还能换，直接说我今天想喝别的。"],
  [1, "刚熟起来的同伴把私人频道留给你，说以后舰上有事可以直接找他。", "先留着。相处久了，我才会用这个频道聊自己的事。", "偶尔发点无关紧要的事，看看聊起来舒不舒服。", "下次碰到烦心事，愿意挑一件和他说。", "如果今天就有件想说的事，我会直接发过去。"],
  [4, "三个人凑了一堆吃不完的食材，今晚打算在宿舍煮火锅。群里都说「你们定」。", "把各自手上的食材列出来，大家挑自己想带的。", "先认领我能做的，让另外两个人选他们要管什么。", "把还缺的东西和时间对一下，自己顺手补最急的一件。", "我来凑一锅菜单、约时间，最后把需要大家带的东西发群里。"],
  [0, "周五回到家，发现原本约好的局取消了。难得没安排，你是松了一口气还是有点空？", "松一口气。耳机一戴，今晚谁也别找我。", "先自己待会儿，想说话了再找一个熟人。", "问问小群里有没有人同样闲下来，没约到也行。", "我会发条消息把局续上，叫个新朋友来也挺好。"],

function rankOperators(answers) {
  const totals = Array(dimensions.length).fill(0);
  bank.forEach(([dimension], index) => { totals[dimension] += optionValues[answers[index]]; });
  // Each dimension has four questions. Scale means by four for exact integer comparisons.
  return operators.map(operator => ({
    operator,
    distance: totals.reduce((sum, total, i) => sum + (total - 4 * operator.profile[i]) ** 2, 0),
    totals,
  })).sort((a, b) => a.distance - b.distance || a.operator.code.localeCompare(b.operator.code, 'en'));
}

function showQuestion() {
  const [, question, ...choices] = bank[current];
  get('form').dataset.transition = current % 2 ? 'odd' : 'even';
  get('intro').hidden = true;
  get('results').hidden = true;
  get('quiz').hidden = false;
  get('question').textContent = question;
  get('counter').textContent = String(current + 1).padStart(2, '0') + ' / ' + bank.length;
  get('progress').value = answers.filter(answer => answer !== null).length;
  get('previous').disabled = current === 0;
  get('next').textContent = current === bank.length - 1 ? '提交并查看档案' : '下一题';
  get('next').disabled = answers[current] === null;
  const labels = optionOrders[current % optionOrders.length].map(index => {
    const label = document.createElement('label');
    label.className = 'choice';
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'answer';
    input.value = String(index);
    input.checked = answers[current] === index;
    label.append(input, choices[index]);
    return label;
  });
  get('choices').replaceChildren(...labels);
  get('question').focus({preventScroll:true});
  window.scrollTo(0, 0);
}

function explainMatch(answers, winner, runner) {
  // Prefer answers close to the winning profile that also help distinguish the runner-up.
  const ranked = bank.map(([dimension, , ...choices], index) => {
    const value = optionValues[answers[index]];
    const error = Math.abs(value - winner.profile[dimension]);
    const runnerError = Math.abs(value - runner.profile[dimension]);
    return { dimension, text: choices[answers[index]], weight: runnerError - 2 * error };
  }).sort((a, b) => b.weight - a.weight);
  return [ranked[0], ranked.find(item => item.dimension !== ranked[0].dimension)];
}

  };
  const polygon = (values, className) => {
    const points = values.map((value, i) => point(i, value).map(n => n.toFixed(2)).join(',')).join(' ');
    return `<polygon class="${className}" points="${points}"/>`;
  };
  const grid = [.25, .5, .75, 1].map(value => polygon(dimensions.map(() => value), 'grid'));
  const axes = dimensions.map(([label], i) => {
    const [x,y] = point(i,1);
    const [lx,ly] = point(i,1.27);
    return `<line class="axis" x1="${center[0]}" y1="${center[1]}" x2="${x}" y2="${y}"/>
      <text text-anchor="middle" dominant-baseline="middle" x="${lx}" y="${ly}">${label}</text>`;
  });
  return `<svg class="radar" viewBox="0 0 360 280" role="img" aria-label="你与${name}的六项性格雷达图">
    ${grid.join('')}${axes.join('')}
    ${polygon(totals.map(n => asPercent(n) / 100), 'you')}
    ${polygon(profile.map(n => asPercent(n * 4) / 100), 'operator')}
  </svg>`;
}

function comparisonRows(totals, profile) {
  const describe = (value, lower, upper) => value < -2 ? lower : value > 2 ? upper : '视情况而定';
  return dimensions.map(([label, lower, upper], i) => {
    const operatorValue = profile[i] * 4;
    return {
      label,
      you: describe(totals[i], lower, upper),
      operator: describe(operatorValue, lower, upper),
      gap: Math.abs(totals[i] - operatorValue),
      stronger: Math.abs(totals[i]) > Math.abs(operatorValue) ? '你' : '干员',
    };
  });
}

function comparisonSummary(rows, name) {
  const byGap = [...rows].sort((a, b) => a.gap - b.gap);
  const closest = byGap[0];
  const furthest = byGap.at(-1);
  function describe(row) {
    if (row.you !== row.operator) return '你的倾向是「' + row.you + '」，' + name + '的倾向是「' + row.operator + '」。';
    if (row.you === '视情况而定') return '你们在这项都比较灵活，倾向接近中间。';
    const degree = row === furthest && row.gap > 0 ? '，其中' + row.stronger + '的倾向更明显' : '';
    return '你们都倾向「' + row.you + '」' + degree + '。';
  }
  const summary = [
    ['最相近', closest, furthest.gap === 0 ? '六项答题倾向均与这份干员档案相符。' : describe(closest)],
  ];
  if (furthest.gap > 0) summary.push(['差异最大', furthest, describe(furthest)]);
  return summary;
}

function comparisonPanel(totals, profile, name) {
  const rows = comparisonRows(totals, profile);
  return `
    <section class="panel comparison">
      <h2>你和干员差在哪</h2>
      <div class="insights">${comparisonSummary(rows, name).map(([caption, row, explanation]) => `
        <article class="insight"><h3><span>${caption}</span>${row.label}</h3><p>${explanation}</p></article>`
      ).join('')}</div>
      <details class="more-traits">
        <summary>展开六项对照</summary>
        <div class="traitlist">${rows.map(row => `<div class="trait">
          <strong>${row.label}</strong><p>你 · ${row.you}<br>${name} · ${row.operator}</p></div>`
        ).join('')}</div>
      </details>
    </section>`;
}

function showResults() {
  const ranking = rankOperators(answers);
  const [first, second] = ranking;
  const winner = first.operator;
  const [voiceLine, voiceTitle] = voiceLines[operators.indexOf(winner)];
  const reasons = explainMatch(answers, winner, second.operator);
  const score = matchIndex(first);
  const tied = first.distance === second.distance;
  get('quiz').hidden = true;
  const results = get('results');
  results.hidden = false;
  // Interpolation uses only the fixed question bank and internal profiles.
  results.innerHTML = `
    <article class="hero" style="--operator-tone:${operatorTints[operators.indexOf(winner)]}">
      <figure class="stage">
        <img class="photo" src="${portraitFile(winner)}" alt="${winner.name}精二立绘" decoding="async" fetchpriority="high">
        <button class="art-action" type="button" id="open-art">查看完整立绘</button>
        <div class="archive-plate">
          <div class="plate-name"><p class="kicker">最接近的干员</p>
            <h1 id="result-title" tabindex="-1">${winner.name}</h1>
            <p class="operator-code">${winner.code}</p>
          </div>
          <div class="match"><strong>${score}</strong><span>匹配指数 / 100</span></div>
        </div>
      </figure>
      <div class="hero-text">
        <blockquote class="voice"><p>「${voiceLine}」</p>
          <cite><a href="${winner.source}#语音记录" target="_blank" rel="noreferrer">干员语音 · ${voiceTitle}</a></cite>
        </blockquote>
        <div class="profile-copy">
          <p class="quote">${winner.line}</p>
          <p class="hero-copy">${winner.description}</p>
        </div>
      </div>
    </article>
    <dialog id="art-dialog" aria-labelledby="art-title">
      <div class="dialog-head"><h2 id="art-title">${winner.name} · 精二立绘</h2>
        <form method="dialog"><button type="submit" class="secondary">关闭</button></form></div>
      <img class="dialog-art" alt="${winner.name}精二立绘">
    </dialog>
    <div class="data-grid">
      <section class="panel">
        <h2>六维性格雷达</h2>
        ${radarChart(first.totals, winner.profile, winner.name)}
        <p class="key"><span>你的答题倾向</span><span>${winner.name}的档案倾向</span></p>
      </section>
      ${comparisonPanel(first.totals, winner.profile, winner.name)}
      <section class="panel">
        <h2>最接近你的 5 位干员</h2>
        <ol class="rank-list">${ranking.slice(0,5).map(candidate => {
          const value = matchIndex(candidate);
          return `<li><span>${candidate.operator.name}</span><span class="rank-line" aria-hidden="true"><i style="width:${value}%"></i></span><strong>${value}</strong></li>`;
        }).join('')}</ol>
        <p class="note">${tied ? '并列最接近：' + ranking.filter(c => c.distance === first.distance).map(c => c.operator.name).join('、') + '。' : ''}
          匹配指数来自六维距离。角色分值基于档案解读。</p>
      </section>
      <section class="panel evidence">
        <h2>哪些回答让你像 TA</h2>
        <ol>${reasons.map(reason => `<li><strong>${dimensions[reason.dimension][0]}</strong> · ${reason.text}</li>`).join('')}</ol>
        <p class="basis">${winner.basis} <a href="${winner.source}" target="_blank" rel="noreferrer">查看 PRTS 干员档案</a></p>
      </section>
    </div>
    <section class="panel share-panel" aria-labelledby="share-heading">
      <div class="qr-frame"><img class="share-code" src="quiz-share.png" alt="扫码打开罗德岛入职档案" width="328" height="328"></div>
      <div><h2 id="share-heading">分享测试</h2><p>扫码让朋友测一测像哪位干员。</p>
        <button type="button" class="secondary" id="copy-quiz-link">复制测试链接</button>
        <p class="status" id="share-status" role="status"></p>
      </div>
    </section>
    <div class="controls result-controls">
      <button type="button" class="secondary" id="restart">重新测试</button>
      <button type="button" class="action" id="save">保存结果长图（PNG）</button>
    </div>
    <p class="status" id="status" role="status"></p>`;
  get('open-art').addEventListener('click', () => {
    const dialog = get('art-dialog');
    dialog.querySelector('img').src = portraitFile(winner);
    dialog.showModal();
  });
  get('save').addEventListener('click', () => saveCard(winner, score, voiceLine, ranking, reasons));
  get('copy-quiz-link').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(shareUrl);
      get('share-status').textContent = '链接已复制';
    } catch {
      const link = document.createElement('a');
      link.href = shareUrl;
      link.textContent = shareUrl;
      get('share-status').replaceChildren(link);

  get('restart').addEventListener('click', start);
  get('result-title').focus({preventScroll:true});

}

function cardLines(context, content, x, y, maxWidth, lineHeight) {
  let line = '';
  for (const character of content) {
    if (line && context.measureText(line + character).width > maxWidth) {
      context.fillText(line, x, y);
      y += lineHeight;
      line = '';
    }
    line += character;
  }
  context.fillText(line, x, y);
  return y + lineHeight;
}

function loadCardImage(source) {
  return new Promise(resolve => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => resolve(null);
    image.src = source;
  });
}

function drawCardRadar(context, totals, profile, y) {
  const centerX = 450;
  const centerY = y + 175;
  const radius = 126;
  const point = (axis, amount) => {
    const angle = axis * Math.PI / 3 - Math.PI / 2;
    return [centerX + Math.cos(angle) * radius * amount, centerY + Math.sin(angle) * radius * amount];
  };
  function polygon(values, stroke, fill) {
    context.beginPath();
    values.forEach((value, axis) => {
      const [x, y] = point(axis, value);
      if (axis === 0) context.moveTo(x, y);
      else context.lineTo(x, y);
    });
    context.closePath();
    if (fill) {
      context.fillStyle = fill;
      context.fill();
    }
    context.strokeStyle = stroke;
    context.stroke();
  }
  [.25,.50,.75,1].forEach(value => polygon(dimensions.map(() => value), '#566571'));
  polygon(totals.map(value => asPercent(value) / 100), '#f5f7f8', '#f5f7f833');
  context.setLineDash([8,6]);
  polygon(profile.map(value => asPercent(value * 4) / 100), '#7ee6fc');
  context.setLineDash([]);
  context.textAlign = 'center';
  context.fillStyle = '#d4dde4';
  dimensions.forEach(([label], axis) => {
    const [x, y] = point(axis, 1.30);
    context.fillText(label, x, y + 7);
  });
  context.fillStyle = '#f5f7f8';
  context.fillText('你的答题倾向', 326, y + 373);
  context.fillStyle = '#7ee6fc';
  context.fillText('干员的档案倾向', 570, y + 373);
  context.textAlign = 'left';
}

async function saveCard(winner, score, voiceLine, ranking, reasons) {
  const button = get('save');
  const status = get('status');
  button.disabled = true;
  status.textContent = '正在生成结果长图…';
  try {
    const [background, portrait, qrImage] = await Promise.all([
      loadCardImage('archive-background.webp'),
      loadCardImage(portraitFile(winner)),
      loadCardImage('quiz-share.png'),
      document.fonts.ready,
    ]);
    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 3200;
    const context = canvas.getContext('2d');
    if (!context || !background || !portrait || !qrImage) throw new Error('Image unavailable');

    const font = '"Rhodes Sans", "PingFang SC", "Microsoft YaHei", sans-serif';
    const left = 56;
    const right = 844;
    const width = right - left;
    const ink = '#f2f4f4';
    const muted = '#becad3';
    const accent = '#7ee6fc';
    const dark = '#121a23';
    const setText = (size, weight = 400, color = muted) => {
      context.font = weight + ' ' + size + 'px ' + font;
      context.fillStyle = color;
    };
    context.fillStyle = dark;
    context.fillRect(0,0,900,canvas.height);

    const bgScale = Math.max(900 / background.width, 690 / background.height);
    const bgWidth = background.width * bgScale;
    const bgHeight = background.height * bgScale;
    context.save();
    context.beginPath();
    context.rect(0,0,900,690);
    context.clip();
    context.drawImage(background,(900-bgWidth)/2,(690-bgHeight)/2,bgWidth,bgHeight);
    context.restore();
    const portraitScale = Math.min(910 / portrait.width, 704 / portrait.height);
    const portraitWidth = portrait.width * portraitScale;
    const portraitHeight = portrait.height * portraitScale;
    context.drawImage(portrait,(900-portraitWidth)/2,22+(676-portraitHeight)/2,portraitWidth,portraitHeight);
    const gradient = context.createLinearGradient(0,460,0,690);
    gradient.addColorStop(0,'#121a2300');
    gradient.addColorStop(1,dark);
    context.fillStyle = gradient;
    context.fillRect(0,460,900,230);
    context.fillStyle = '#121a23bb';
    context.fillRect(0,0,900,77);
    setText(27,700,accent);
    context.fillText('罗德岛入职档案 / 干员匹配',left,48);
    context.fillRect(left,619,5,85);
    setText(81,900,ink);
    context.fillText(winner.name,left+18,675,530);
    context.font = '700 25px "Rhodes Display", sans-serif';
    context.fillText(winner.code.toUpperCase(),left+20,710,530);
    setText(48,800,accent);
    context.textAlign = 'right';
    context.fillText(score,right,661);
    setText(20,650,muted);
    context.fillText('匹配指数 / 100',right,694);
    context.textAlign = 'left';

    let y = 770;
    setText(29,750,accent);
    y = cardLines(context,'「' + voiceLine + '」',left,y,width,41) + 13;
    setText(31,700,ink);
    y = cardLines(context,winner.line,left,y,width,43) + 5;
    setText(25);
    y = cardLines(context,winner.description,left,y,width,37) + 24;

    function section(title) {
      context.fillStyle = '#405360';
      context.fillRect(left,y,width,1);
      y += 46;
      setText(31,800,ink);
      context.fillText(title,left,y);
      y += 25;
    }
    section('六维性格雷达');
    setText(24,600);
    drawCardRadar(context,ranking[0].totals,winner.profile,y);
    y += 412;

    section('你和干员差在哪');
    const rows = comparisonRows(ranking[0].totals, winner.profile);
    for (const [caption, row, explanation] of comparisonSummary(rows, winner.name)) {
      setText(24,750,accent);
      context.fillText(caption + ' / ' + row.label,left,y+20);
      setText(24,400);
      y = cardLines(context,explanation,left,y+57,width,34) + 10;
    }

    section('最接近你的 5 位干员');
    ranking.slice(0,5).forEach((candidate,i) => {
      const value = matchIndex(candidate);
      setText(24,700,ink);
      context.fillText(candidate.operator.name,left,y+25,182);
      context.fillStyle = '#293c49';
      context.fillRect(left+196,y+10,476,10);
      context.fillStyle = i === 0 ? accent : '#8195a5';
      context.fillRect(left+196,y+10,476*Number(value)/100,10);
      setText(22,600);
      context.textAlign = 'right';
      context.fillText(value,right,y+25);
      context.textAlign = 'left';
      y += 45;
    });
    y += 14;

    section('哪些回答让你像 TA');
    reasons.forEach(reason => {
      setText(24,550);
      y = cardLines(context,dimensions[reason.dimension][0]+' · '+reason.text,left,y+23,width,37) + 1;
    });
    y += 14;
    section('分享测试');
    context.fillStyle = '#cae1eb';
    context.fillRect(left,y,width,196);
    context.fillStyle = '#2d5a73';
    context.fillRect(left,y,6,196);
    setText(26,800,'#142c3f');
    context.fillText('扫码打开罗德岛入职档案',left+25,y+67,560);
    setText(20,500,'#35546a');
    context.fillText('非官方同人测试 · 干员立绘 © 鹰角网络',left+25,y+117,560);
    context.imageSmoothingEnabled = false;
    context.drawImage(qrImage,right-180,y+16,164,164);

    const image = document.createElement('canvas');
    image.width = canvas.width;
    image.height = y+219;
    image.getContext('2d').drawImage(canvas,0,0);
    const blob = await new Promise(resolve => image.toBlob(resolve,'image/png'));
    if (!blob) throw new Error('PNG encoding failed');
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = '罗德岛入职档案-' + winner.name + '-结果长图.png';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url),60000);
    status.textContent = '结果长图已生成，请查看浏览器下载。';
  } catch {
    status.textContent = '结果长图生成失败，请点按钮重试。';
  } finally {
    button.disabled = false;
  }
}

function start() {
  answers.fill(null);
  current = 0;
  showQuestion();
  window.scrollTo(0, 0);
}

get('start').addEventListener('click', start);
get('choices').addEventListener('change', event => {
  answers[current] = Number(event.target.value);
  get('next').disabled = false;
  get('progress').value = answers.filter(answer => answer !== null).length;
});
get('previous').addEventListener('click', () => { current -= 1; showQuestion(); });
get('form').addEventListener('submit', event => {
  event.preventDefault();
  if (answers[current] === null) return;
  if (current === bank.length - 1) {
    showResults();
    return;
  }
  current += 1;
  showQuestion();
});
</script>
