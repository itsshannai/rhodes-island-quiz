<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111417">
<meta name="description" content="24 道日常性格题，从 20 位明日方舟干员中找出和你最接近的一位。">
<title>罗德岛入职档案 · 明日方舟同人测试</title>
<style>
:root{color-scheme:dark;--bg:#111417;--sheet:#1a1e22;--sheet-dark:#14181b;--ink:#f4f2e9;--muted:#bec5ca;--line:#39434a;--signal:#f6cd67;--cyan:#8cddf2;--mono:ui-monospace,"SFMono-Regular",Consolas,monospace;font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
button,summary{font:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.48}
button:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
a{color:var(--cyan)}
h1,h2,h3,p,figure{margin:0}
[hidden]{display:none!important}
.frame{width:min(calc(100% - 56px),1100px);margin-inline:auto}
.site-head{min-height:61px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.wordmark{display:flex;align-items:center;gap:10px;font-size:.94rem;font-weight:790;letter-spacing:.06em}
.emblem{width:16px;height:16px;border:1px solid var(--cyan);transform:rotate(45deg);display:grid;place-items:center}
.emblem::after{content:"";height:6px;width:6px;background:var(--cyan)}
.fan{font-size:.72rem;color:var(--muted);white-space:nowrap}
.site-foot{display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding:16px 0 max(18px,env(safe-area-inset-bottom));color:var(--muted);font-size:.75rem}
main{min-height:calc(100svh - 117px);padding:22px 0 46px}
.action,.secondary{display:inline-grid;place-items:center;min-height:49px;padding:10px 19px;border:1px solid var(--line);font-weight:760}
.action{background:var(--signal);border-color:var(--signal);color:#171b1d}
.action:not(:disabled):hover{background:#ffe49e}
.secondary{color:var(--ink);background:var(--sheet-dark)}
.secondary:not(:disabled):hover{border-color:var(--cyan)}
.kicker,.counter,.operator-code{font:650 .8rem var(--mono);letter-spacing:.11em}
.kicker,.counter{color:var(--cyan)}
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:clamp(540px,72svh,740px);border:1px solid var(--line);background:var(--sheet-dark)}
.intro-art{position:relative;background:#24292e url('intake-hangar.webp') center 40%/cover no-repeat;min-height:100%;overflow:hidden}
.intro-art::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.36;background:repeating-linear-gradient(0deg,transparent 0 47px,#91b8c529 47px 48px)}
.intro-copy{display:flex;flex-direction:column;justify-content:end;align-items:start;padding:clamp(22px,6vw,63px)}
.intro h1{font-size:clamp(2.45rem,6.4vw,5.6rem);font-weight:850;line-height:1.08;letter-spacing:-.075em;margin:13px 0 14px}
.intro .lead{max-width:36ch;color:var(--muted);line-height:1.68}
.intro .action{min-width:185px;margin-top:25px}
.intro small{color:var(--muted);margin-top:12px}
.quiz{width:min(100%,670px);margin:clamp(0px,4vw,38px) auto 0;min-height:calc(100svh - 151px);display:flex;flex-direction:column}
.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--muted)}
progress{appearance:none;width:100%;height:5px;border:0;display:block;background:var(--line)}
progress::-webkit-progress-bar{background:var(--line)}
progress::-webkit-progress-value{background:var(--cyan)}
progress::-moz-progress-bar{background:var(--cyan)}
.quiz form{display:flex;flex:1;flex-direction:column}
fieldset{padding:0;border:0;margin:24px 0 16px;min-width:0}
legend{padding:0;margin-bottom:16px;font-size:clamp(1.37rem,4.7vw,2.21rem);font-weight:770;line-height:1.4}
legend:focus,h1:focus{outline:none}
.choice{display:flex;gap:12px;align-items:center;min-height:61px;margin-bottom:8px;padding:12px 14px;cursor:pointer;background:var(--sheet);border:1px solid var(--line);line-height:1.48}
.choice:hover,.choice:has(input:checked){border-color:var(--cyan)}
.choice:has(input:checked){background:#21343c;box-shadow:inset 3px 0 var(--cyan)}
.choice input{margin:0;accent-color:var(--cyan);width:17px;height:17px;flex:0 0 17px}
.controls{display:flex;gap:10px;align-items:center;justify-content:space-between}
.quiz .controls{margin-top:auto;padding:10px 0 0}
.quiz .action{min-width:min(58%,205px)}
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.61fr) minmax(0,1fr);border:1px solid var(--line);overflow:hidden;background:var(--sheet-dark)}
.stage{display:grid;place-items:center;position:relative;isolation:isolate;min-width:0;min-height:445px;overflow:hidden;background:radial-gradient(ellipse at 50% 36%,#35464b7a,#171e28d9 66%,#131920fa),url('archive-background.webp') center/cover no-repeat,#141a21}
.stage::before{content:"";position:absolute;z-index:-1;inset:0;background:repeating-linear-gradient(90deg,transparent 0 47px,#98cede1b 47px 48px),repeating-linear-gradient(0deg,transparent 0 47px,#98cede1b 47px 48px);mask-image:radial-gradient(ellipse,#000,transparent 86%)}
.stage::after{content:"";position:absolute;z-index:-1;inset:14px;border:1px solid #7d9ca439;pointer-events:none}
.photo{display:block;width:100%;height:auto;max-height:76svh;min-height:360px;object-fit:contain;object-position:center;filter:drop-shadow(0 10px 12px #0007);padding:10px}
.art-action{position:absolute;bottom:15px;right:15px;background:#11171de8;color:var(--ink);border:1px solid #8aa9b3a3;min-height:44px;padding:7px 11px;font-size:.77rem;font-weight:700}
.hero-text{align-self:end;padding:clamp(20px,4vw,42px);min-width:0}
.hero h1{font-size:clamp(3rem,7.4vw,6rem);line-height:1.04;letter-spacing:-.075em;overflow-wrap:anywhere;margin:7px 0 6px}
.operator-code{display:block;color:var(--muted);text-transform:uppercase}
.hero-copy{font-size:.95rem;color:var(--muted);line-height:1.66;margin-top:10px}
.quote{font-size:1.16rem;line-height:1.45;font-weight:730;margin-top:18px}
.match{display:flex;align-items:baseline;gap:8px;white-space:nowrap;margin-top:16px;color:var(--signal)}
.match strong{font:750 2.05rem/1 var(--mono)}
.match span{font-size:.76rem;color:var(--muted)}
.hero-text .action{margin-top:19px;min-width:160px}
.status{color:var(--muted);font-size:.8rem;margin-top:8px}
.status:empty{display:none}
.data-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:13px;margin-top:14px}
.panel{min-width:0;padding:clamp(17px,3vw,26px);background:var(--sheet);border:1px solid var(--line)}
.panel h2{font-size:1.16rem;margin-bottom:14px}
.radar{display:block;width:min(100%,418px);height:auto;margin:0 auto;overflow:visible}
.radar text{fill:var(--muted);font-size:12px;font-family:system-ui,sans-serif}
.radar .grid{fill:none;stroke:#5b6970;stroke-width:1}
.radar .axis{stroke:#4b5961;stroke-width:1}
.radar .you{fill:#f6cd6734;stroke:var(--signal);stroke-width:2.2;stroke-linejoin:round}
.radar .operator{fill:#8cddf212;stroke:var(--cyan);stroke-width:2;stroke-dasharray:5 4;stroke-linejoin:round}
.key{display:flex;gap:12px 18px;flex-wrap:wrap;color:var(--muted);font-size:.79rem;margin-top:5px}
.key span::before{content:"";display:inline-block;width:12px;height:3px;margin-right:6px;vertical-align:middle;background:var(--signal)}
.key span+span::before{background:var(--cyan)}
.insights{display:grid;gap:8px}
.insight{background:var(--sheet-dark);border-left:2px solid var(--line);padding:11px 12px}
.insight:first-child{border-color:var(--cyan)}
.insight h3{font-size:.94rem;line-height:1.4}
.insight h3 span{color:var(--cyan);font-size:.74rem;margin-right:8px}
.insight p{color:var(--muted);font-size:.87rem;line-height:1.55;margin-top:5px}
.more-traits{margin-top:13px}
.more-traits summary{padding:10px 0;min-height:43px;color:var(--cyan);font-size:.88rem}
.traitlist{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.trait{font-size:.82rem;padding-bottom:8px;border-bottom:1px solid var(--line)}
.trait:last-child{border-bottom:0}
.trait p{color:var(--muted);margin-top:3px;line-height:1.55}
.rank-list{list-style:none;margin:0;padding:0;display:grid;gap:11px}
.rank-list li{display:grid;grid-template-columns:minmax(5.2em,auto) 1fr 3.3em;align-items:center;gap:9px;font-size:.87rem}
.rank-list li strong{font:650 .84rem var(--mono);text-align:right}
.rank-line{height:6px;background:#42515a}
.rank-line i{display:block;height:100%;background:#7c98a5}
.rank-list li:first-child .rank-line i{background:var(--signal)}
.note,.basis,.evidence li{color:var(--muted);line-height:1.65}
.note{font-size:.78rem;margin-top:11px}
.evidence ol{padding-left:1.15rem;margin:0 0 9px}
.evidence li{font-size:.87rem}
.evidence li+li{margin-top:6px}
.evidence strong{color:var(--ink)}
.basis{font-size:.84rem}
.result-controls{justify-content:flex-end;margin-top:15px}
dialog{width:min(calc(100% - 22px),980px);padding:14px;border:1px solid var(--line);background:#131a20;color:var(--ink);overflow:auto;max-height:92svh}
dialog::backdrop{background:#080a0bdc}
dialog .dialog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
dialog h2{font-size:1rem}
dialog .dialog-art{display:block;width:100%;height:74svh;object-fit:contain}
@media(max-width:680px){
  .frame{width:calc(100% - 28px)}
  .site-head{min-height:51px}
  main{padding:12px 0 24px}
  .intro{position:relative;display:grid;grid-template-columns:1fr;min-height:min(720px,max(525px,calc(100svh - 120px)));align-items:end;isolation:isolate;overflow:hidden}
  .intro-art{position:absolute;z-index:-2;inset:0;background-position:center 34%}
  .intro::after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(0deg,#101417fa 0%,#101417ed 21%,#10141752 58%,#1014170a 84%);pointer-events:none}
  .intro-copy{padding:18px 20px 21px}
  .intro h1{font-size:clamp(2.42rem,11.2vw,4.3rem);margin:10px 0}
  .intro .lead{font-size:.91rem}
  .intro .action{margin-top:18px;width:100%}
  .intro small{margin-top:9px;font-size:.72rem}
  .quiz{min-height:calc(100svh - 94px)}
  .quiz .controls{background:var(--bg);position:sticky;bottom:0;padding-bottom:max(9px,env(safe-area-inset-bottom));box-shadow:0 -7px 18px #111417d9}
  .hero{display:block}
  .stage{min-height:0;height:clamp(292px,50svh,550px)}
  .photo{position:absolute;inset:0;height:100%;max-height:none;min-height:0;padding:2px 1px 7px}
  .art-action{bottom:13px;right:13px}
  .hero-text{padding:17px 17px 18px;border-top:1px solid var(--line)}
  .hero h1{font-size:clamp(2.75rem,12vw,4.8rem)}
  .hero-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .match{margin-top:0;gap:4px;flex-direction:column;align-items:end}
  .match strong{font-size:1.65rem}
  .match span{font-size:.65rem}
  .quote{margin-top:12px;font-size:1.04rem}
  .hero-copy{margin-top:6px;font-size:.89rem}
  .hero-text .action{margin-top:13px;width:100%}
  .data-grid{grid-template-columns:1fr}
  .comparison{order:-1}
}
</style>
</head>
<body>
<header class="frame site-head"><span class="wordmark"><i class="emblem" aria-hidden="true"></i>罗德岛入职档案</span><span class="fan">非官方同人测试</span></header>
<main class="frame">
  <section class="intro" id="intro">
    <div class="intro-art" aria-hidden="true"></div>
    <div class="intro-copy">
      <p class="kicker">RHODES ISLAND / INTAKE</p>
      <h1>你最像哪位<br>罗德岛干员？</h1>
      <p class="lead">从一次深夜聊天，到一趟临时改道的旅行。选你真的会做的事，看看你和谁最像。</p>
      <button type="button" class="action" id="start">开始测试</button>
      <small>24 道情境题 · 约 4 分钟 · 20 位干员</small>
    </div>
  </section>
  <section class="quiz" id="quiz" hidden>
    <div class="progress-row"><span>入职问卷</span><span class="counter" id="counter"></span></div>
    <progress id="progress" max="24" value="0" aria-label="已完成的题数"></progress>
    <form id="form">
      <fieldset><legend id="question" tabindex="-1"></legend><div id="choices"></div></fieldset>
      <div class="controls"><button type="button" class="secondary" id="previous">上一题</button><button type="submit" class="action" id="next" disabled>下一题</button></div>
    </form>
  </section>
  <section class="results" id="results" hidden></section>
  <noscript>请启用 JavaScript 后开始测试。</noscript>
</main>
<footer class="frame site-foot"><span>仅供娱乐 · 答题在本机处理</span><span>干员立绘 © 鹰角网络</span></footer>
<script>
const dimensions = [
  ['社交方式', '安静观察', '主动靠近'],
  ['信任节奏', '熟悉后敞开', '先给一点信任'],
  ['分歧表达', '等合适时机', '及时说开'],
  ['面对未知', '需要确定感', '享受即兴'],
  ['责任倾向', '尊重各自选择', '主动接住局面'],
  ['关心方式', '提供实际帮助', '给予情绪陪伴'],
];

// Choices run from the first pole to the second; display order is interleaved.
const bank = [
  [0, '被朋友带进一个全是陌生人的深夜饭局，你通常是什么状态？', '安静坐着听，能听到有趣的故事就满足。', '先聊身边那一个人，熟一点再说。', '听见感兴趣的话题，我会顺势加入。', '很快就会抛个问题，让这桌的人都能聊起来。'],
  [3, '一个人到陌生城市，醒来发现今天完全空着。你想怎么过？', '从出发前存的几个地方里选，心里比较踏实。', '先定一个想去的地方，其余到那儿再想。', '上街随便走走，时不时看一眼地图。', '坐上第一班看着顺眼的车，看看它把我带去哪。'],
  [5, '朋友凌晨发来一句「有点难受，睡不着」。你最可能怎么回？', '问是什么事让他睡不着，看看今晚能做什么。', '问他需要我打个电话，还是帮他安排点什么。', '回一句「我在」，再问他想不想讲讲。', '先陪他聊一会儿，聊到他安静下来也行。'],
  [2, '关系很好的朋友拿你开了一个玩笑，你确实介意。', '先让场面过去，改天两个人独处时再提。', '当时把话题岔开，散场就私下找他说。', '当场轻轻说一句「这个我有点介意」。', '当场说明哪句话让我不舒服，也给对方回应的机会。'],
  [1, '新认识的人认真聊起自己的脆弱一面，你会怎么接？', '认真听，自己的事情会等熟了再讲。', '分享一件相似的小事，把更私人的部分留着。', '如果有共鸣，我会聊聊自己曾经怎么熬过来。', '愿意讲一件平时很少提起的真事，让对方知道我懂。'],
  [4, '朋友聚会散场，一位熟人的情绪突然变得很差。', '问他想和谁待着，让他来决定。', '告诉他今晚可以找我，也问问有没有熟悉的人在附近。', '我会主动留下陪他一会儿，再问他想怎么安排。', '我会留下来陪到他安顿好，今晚的其他安排往后推。'],
  [0, '好不容易有个完全属于自己的周六，你最想怎么充电？', '一个人待足一天，消息也慢点回。', '大部分时间自己过，晚上见一个熟人。', '约几个熟悉的人见面，别的时间随意。', '发消息组个局，有新人加入也挺开心。'],
  [3, '朋友提议临时改道，去看一个地图上几乎没人标记的日落点。', '继续去原来选好的地方，知道那里能看见什么。', '先查到达时间和返回路线，合适再改。', '约好最多绕路半小时，有空就试试看。', '马上改道，没看到日落也算多看了一段路。'],
  [1, '认识不久的人很合拍，邀请你下周一起短途旅行。', '先婉拒，下次多见几回再考虑一起出门。', '先约一个下午，看看长时间相处是什么感觉。', '愿意一起去一天，提前聊清楚各自习惯。', '如果我也想去，就答应一起，到了再磨合。'],
  [5, '朋友盼了很久的一件事落空了，说自己准备那么久真傻。', '陪他想想现在还能挽回或重新尝试的部分。', '问有没有一件眼下的事，我可以跟他一起处理。', '告诉他那段努力我有看见，等他想聊了我在。', '先陪他把这份失落讲完，让他今天可以难过。'],
  [4, '四个人约旅行，快出发了，还有人对住宿犹豫不决。', '把选项给大家，各自决定能否接受。', '说出自己愿意住哪里，让另外几个人也表个态。', '问大家最在意哪一点，我来找符合共同条件的选择。', '我把几个人的顾虑问清楚，给出一套能定下来的方案。'],
  [2, '你和喜欢的人对一件重要的事有不同看法，聊着聊着开始上头。', '先结束话题，等彼此缓下来再开口。', '指出现在都不在状态，约个具体时间继续。', '先说清我真正介意的点，之后再聊细节。', '现在把分歧讲透，也请对方说出他的顾虑。'],
  [3, '突然想学一样全新的东西，比如调酒、陶艺或拍胶片。', '找一套成熟的入门步骤，一步一步来。', '先看别人是怎么做的，再挑个简单的起点。', '请会的人带我玩一回，做完再看教程。', '买最基础的材料，先动手，做错了再查。'],
  [0, '朋友婚礼上，安排你和一桌素不相识的人坐一起。', '礼貌打招呼，然后享受自己的那份安静。', '和左右邻座聊聊我怎么认识新人的。', '跟上桌上已经聊起来的话题。', '主动把大家介绍起来，说不定散场还会加好友。'],
  [2, '发现亲近的人最近一直避开一个你很在意的话题。', '先等等，留意对方什么时候愿意谈。', '挑时机问一句，看对方现在有没有余力聊。', '把我留意到的变化说出来，也说我希望聊聊。', '主动开口把话题说清楚，邀请对方说说为什么在回避。'],
  [1, '你刚遇到一个很想继续认识的人，聊到自己的生活。', '多聊兴趣和日常，留一点需要时间才知道的事。', '分享自己舒服的话题，看对方愿意聊到哪里。', '愿意说说我真正在乎什么，也想了解对方。', '很自然地说起一个塑造了我的经历，让对方认识我。'],
  [5, '朋友做了一顿很用心的饭却翻车了，边收拾边自责。', '帮着收拾，看还能补救哪一道菜。', '先提议一起把今晚的饭解决，再慢慢聊。', '告诉他我看得出这顿饭准备了很久，然后一起收拾。', '先陪他坐一下，说说我为什么本来就很期待来。'],

function rankOperators(answers) {
  const totals = Array(dimensions.length).fill(0);
  bank.forEach(([dimension], index) => { totals[dimension] += optionValues[answers[index]]; });
  // Each dimension has four questions. Scale means by four for exact integer comparisons.
  return operators.map(operator => ({
    operator,
    distance: totals.reduce((sum, total, i) => sum + (total - 4 * operator.profile[i]) ** 2, 0),
    totals,
  })).sort((a, b) => a.distance - b.distance || a.operator.code.localeCompare(b.operator.code, 'en'));
}

function showQuestion() {
  const [, question, ...choices] = bank[current];

  get('quiz').hidden = false;
  get('question').textContent = question;

  get('progress').value = answers.filter(answer => answer !== null).length;
  get('previous').disabled = current === 0;
  get('next').textContent = current === bank.length - 1 ? '提交并查看档案' : '下一题';
  get('next').disabled = answers[current] === null;
  const labels = optionOrders[current % optionOrders.length].map(index => {
    const label = document.createElement('label');
    label.className = 'choice';
    const input = document.createElement('input');
    input.type = 'radio';
    input.name = 'answer';
    input.value = String(index);
    input.checked = answers[current] === index;
    label.append(input, choices[index]);
    return label;
  });
  get('choices').replaceChildren(...labels);
  get('question').focus({preventScroll:true});
  window.scrollTo(0, 0);
}

function explainMatch(answers, winner, runner) {
  // Prefer answers close to the winning profile that also help distinguish the runner-up.
  const ranked = bank.map(([dimension, , ...choices], index) => {
    const value = optionValues[answers[index]];
    const error = Math.abs(value - winner.profile[dimension]);
    const runnerError = Math.abs(value - runner.profile[dimension]);
    return { dimension, text: choices[answers[index]], weight: runnerError - 2 * error };
  }).sort((a, b) => b.weight - a.weight);
  return [ranked[0], ranked.find(item => item.dimension !== ranked[0].dimension)];
}

const portraitFile = operator => 'operator-' + String(operators.indexOf(operator) + 1).padStart(2, '0') + '.webp?v=elite2';
const asPercent = value => (value + 12) * 100 / 24;
const matchIndex = candidate => (100 * (1 - Math.sqrt(candidate.distance / (dimensions.length * 24 ** 2)))).toFixed(1);

function radarChart(totals, profile, name) {
  const center = [180, 140];
  const point = (index, range) => {
    const angle = index * Math.PI / 3 - Math.PI / 2;
    return [center[0] + Math.cos(angle) * 89 * range, center[1] + Math.sin(angle) * 89 * range];
  };
  const polygon = (values, className) => {
    const points = values.map((value, i) => point(i, value).map(n => n.toFixed(2)).join(',')).join(' ');
    return `<polygon class="${className}" points="${points}"/>`;
  };
  const grid = [.25, .5, .75, 1].map(value => polygon(dimensions.map(() => value), 'grid'));
  const axes = dimensions.map(([label], i) => {
    const [x,y] = point(i,1);
    const [lx,ly] = point(i,1.27);
    return `<line class="axis" x1="${center[0]}" y1="${center[1]}" x2="${x}" y2="${y}"/>
      <text text-anchor="middle" dominant-baseline="middle" x="${lx}" y="${ly}">${label}</text>`;
  });
  return `<svg class="radar" viewBox="0 0 360 280" role="img" aria-label="你与${name}的六项性格雷达图">
    ${grid.join('')}${axes.join('')}
    ${polygon(totals.map(n => asPercent(n) / 100), 'you')}
    ${polygon(profile.map(n => asPercent(n * 4) / 100), 'operator')}
  </svg>`;
}

function comparisonRows(totals, profile) {
  const describe = (value, lower, upper) => value < -2 ? lower : value > 2 ? upper : '视情况而定';
  return dimensions.map(([label, lower, upper], i) => {
    const operatorValue = profile[i] * 4;
    return {
      label,
      you: describe(totals[i], lower, upper),
      operator: describe(operatorValue, lower, upper),
      gap: Math.abs(totals[i] - operatorValue),
      stronger: Math.abs(totals[i]) > Math.abs(operatorValue) ? '你' : '干员',
    };
  });
}

function comparisonPanel(totals, profile, name) {
  const rows = comparisonRows(totals, profile);
  const byGap = [...rows].sort((a, b) => a.gap - b.gap);
  const closest = byGap[0];
  const furthest = byGap.at(-1);
  function describe(row) {
    if (row.you !== row.operator) return '你的倾向是「' + row.you + '」，' + name + '的倾向是「' + row.operator + '」。';
    if (row.you === '视情况而定') return '你们在这项都比较灵活，倾向接近中间。';
    const degree = row === furthest && row.gap > 0 ? '，其中' + row.stronger + '的倾向更明显' : '';
    return '你们都倾向「' + row.you + '」' + degree + '。';
  }
  const summary = [
    ['最相近', closest, furthest.gap === 0 ? '六项答题倾向均与这份干员档案相符。' : describe(closest)],
  ];
  if (furthest.gap > 0) summary.push(['差异最大', furthest, describe(furthest)]);
  return `
    <section class="panel comparison">
      <h2>你和干员差在哪</h2>
      <div class="insights">${summary.map(([caption, row, explanation]) => `
        <article class="insight"><h3><span>${caption}</span>${row.label}</h3><p>${explanation}</p></article>`
      ).join('')}</div>
      <details class="more-traits">
        <summary>展开六项对照</summary>
        <div class="traitlist">${rows.map(row => `<div class="trait">
          <strong>${row.label}</strong><p>你 · ${row.you}<br>${name} · ${row.operator}</p></div>`
        ).join('')}</div>
      </details>
    </section>`;
}

function cardLines(context, content, x, y, maxWidth, lineHeight) {
  let line = '';
  for (const character of content) {
    if (line && context.measureText(line + character).width > maxWidth) {
      context.fillText(line, x, y);
      y += lineHeight;
      line = '';
    }
    line += character;
  }
  context.fillText(line, x, y);
}

function loadCardImage(source) {
  return new Promise(resolve => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => resolve(null);
    image.src = source;
  });
}

async function saveCard(winner, score) {
  const button = get('save');
  const status = get('status');
  button.disabled = true;
  status.textContent = '正在生成结果卡…';
  try {
    const [background, portrait] = await Promise.all([
      loadCardImage('archive-background.webp'),
      loadCardImage(portraitFile(winner)),
    ]);
    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 1120;
    const context = canvas.getContext('2d');
    if (!context || !background || !portrait) throw new Error('Image unavailable');
    context.fillStyle = '#151719';
    context.fillRect(0,0,900,1120);
    const scale = Math.max(900 / background.width, 710 / background.height);
    const bgWidth = background.width * scale;
    const bgHeight = background.height * scale;
    context.drawImage(background,(900-bgWidth)/2,(710-bgHeight)/2,bgWidth,bgHeight);
    const portraitScale = Math.min(700 / portrait.width, 690 / portrait.height);
    const portraitWidth = portrait.width * portraitScale;
    const portraitHeight = portrait.height * portraitScale;
    context.drawImage(portrait,(900-portraitWidth)/2,710-portraitHeight,portraitWidth,portraitHeight);
    const gradient = context.createLinearGradient(0,435,0,780);
    gradient.addColorStop(0,'#15171900');
    gradient.addColorStop(1,'#151719');
    context.fillStyle = gradient;
    context.fillRect(0,435,900,345);
    context.fillStyle = '#f8c761';
    context.fillRect(56,47,75,6);
    context.fillRect(0,780,900,2);
    const font = 'system-ui, "PingFang SC", "Microsoft YaHei", sans-serif';
    context.font = '700 26px ' + font;
    context.fillText('罗德岛入职档案 / 干员匹配',56,95);
    context.fillText('匹配指数 ' + score + ' / 100',56,834);
    context.fillStyle = '#f2efe6';
    context.font = '800 91px ' + font;
    context.fillText(winner.name,51,723,785);
    context.font = '700 34px ' + font;
    cardLines(context,winner.line,56,900,790,45);
    context.fillStyle = '#bdc2c5';
    context.font = '26px ' + font;
    cardLines(context,winner.description,56,962,785,35);
    context.font = '20px ' + font;
    context.fillText('非官方同人测试 · 干员立绘 © 鹰角网络',56,1090);
    const blob = await new Promise(resolve => canvas.toBlob(resolve,'image/png'));
    if (!blob) throw new Error('PNG encoding failed');
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = '罗德岛入职档案-' + winner.name + '.png';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url),60000);
    status.textContent = '结果卡已生成，请查看浏览器下载。';
  } catch {
    status.textContent = '图片暂时无法导出，可以重试或截图保存。';
  } finally {
    button.disabled = false;
  }
}
function start() {
  answers.fill(null);
  current = 0;
  showQuestion();
  window.scrollTo(0, 0);
}

get('start').addEventListener('click', start);
get('choices').addEventListener('change', event => {
  answers[current] = Number(event.target.value);
  get('next').disabled = false;
  get('progress').value = answers.filter(answer => answer !== null).length;
});
get('previous').addEventListener('click', () => { current -= 1; showQuestion(); });
get('form').addEventListener('submit', event => {
  event.preventDefault();
  if (answers[current] === null) return;
  if (current === bank.length - 1) {
    showResults();
    return;
  }
  current += 1;
  showQuestion();
});
</script>
